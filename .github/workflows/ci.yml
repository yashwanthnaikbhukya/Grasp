# CI — every pull request and every push to main (docs/07-phases.md § H.5).
#
# Typecheck, lint, the hard-rule boundary check, and the unit tests. None of
# these need secrets: unit tests never touch Atlas or a model provider
# (integration tests opt in via *.integration.test.ts and are excluded here).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Hard-rule boundaries
        run: pnpm lint:boundaries

      - name: Unit tests
        run: pnpm test

  # Model-quality gate (docs/09-conventions.md — Evals): golden sets through the
  # real gateway, judged on a different provider, compared with the committed
  # baseline. Needs real provider keys — without them (forks, or before the
  # repository secrets are set) every step is skipped and the job passes.
  eval:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Pinned to the models the baseline was recorded on (see .env.example).
      GRASP_MODEL_PROFILE: dev
      GEMINI_MODEL_FAST: gemini-flash-lite-latest
      GEMINI_MODEL_MID: gemini-3.1-flash-lite
      GEMINI_MODEL_BEST: gemini-pro-latest
      GROQ_MODEL_FAST: openai/gpt-oss-20b
      GROQ_MODEL_MID: openai/gpt-oss-120b
    steps:
      - name: Skip without provider keys
        if: env.GEMINI_API_KEY == '' || env.GROQ_API_KEY == ''
        run: echo "::notice::GEMINI_API_KEY / GROQ_API_KEY not set — eval skipped."

      - uses: actions/checkout@v4
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''

      - uses: pnpm/action-setup@v4
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''

      - name: Eval — regression vs baseline
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''
        run: pnpm eval --compare
