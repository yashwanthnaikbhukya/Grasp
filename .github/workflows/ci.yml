# CI — every pull request and every push to main (docs/07-phases.md § H.5).
#
# Typecheck, lint, the hard-rule boundary check, the unit tests and the
# production build. None of these need secrets: unit tests never touch Atlas or a model provider
# (integration tests opt in via *.integration.test.ts and are excluded here).
name: ci

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        # Version comes from "packageManager" in package.json.

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint (Biome)
        run: pnpm lint

      - name: Hard-rule boundaries
        run: pnpm lint:boundaries

      - name: Unit tests
        run: pnpm test

      # The production build. Typecheck and tests can pass while `next build`
      # fails (server/client boundaries, prerendering, bundling), and until
      # 2026-11-09 nothing ran it. No secrets needed: the env is read at request
      # time, not at build time.
      - name: Production build
        run: pnpm build

# The model-quality gate (golden sets through real providers) is eval.yml: it
# spends provider quota, so it runs only when prompts or the gateway change, or
# by hand — not on every push.
