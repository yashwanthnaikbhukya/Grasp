# Model-quality gate (docs/09-conventions.md — Evals): golden sets through the
# real gateway, judged on a different provider, compared with the committed
# baseline.
#
# One run is ~100 model calls (69 cases + ~30 judge calls) on the same free-tier
# keys the app uses, so it runs only when something that can change a score
# changes — prompts, golden sets and scorers, the gateway, schemas, the runner —
# or by hand: Actions → eval → Run workflow. Split out of ci.yml on 2026-11-09.
#
# Needs the GEMINI_API_KEY and GROQ_API_KEY repository secrets. Without them
# (pull requests from forks, or before they are set) every step is skipped and
# the job passes.
name: eval

# The two path lists are the same on purpose — keep them in step.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'packages/prompts/**'
      - 'packages/core/src/eval/**'
      - 'packages/core/src/llm/**'
      - 'packages/core/src/questions/verify.ts'
      - 'packages/core/src/errors.ts'
      - 'packages/schema/src/**'
      - 'scripts/eval.ts'
      - 'scripts/load-env.ts'
      - '.github/workflows/eval.yml'
      # Unit tests never change what a model answers.
      - '!**/*.test.ts'
  push:
    branches: [main]
    paths:
      - 'packages/prompts/**'
      - 'packages/core/src/eval/**'
      - 'packages/core/src/llm/**'
      - 'packages/core/src/questions/verify.ts'
      - 'packages/core/src/errors.ts'
      - 'packages/schema/src/**'
      - 'scripts/eval.ts'
      - 'scripts/load-env.ts'
      - '.github/workflows/eval.yml'
      - '!**/*.test.ts'

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      # Pinned to the models the baseline was recorded on (see .env.example).
      GRASP_MODEL_PROFILE: dev
      GEMINI_MODEL_FAST: gemini-flash-lite-latest
      GEMINI_MODEL_MID: gemini-3.1-flash-lite
      GEMINI_MODEL_BEST: gemini-pro-latest
      GROQ_MODEL_FAST: openai/gpt-oss-20b
      GROQ_MODEL_MID: openai/gpt-oss-120b
    steps:
      - name: Skip without provider keys
        if: env.GEMINI_API_KEY == '' || env.GROQ_API_KEY == ''
        run: echo "::notice::GEMINI_API_KEY / GROQ_API_KEY not set — eval skipped."

      - uses: actions/checkout@v4
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''

      - uses: pnpm/action-setup@v4
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''

      - uses: actions/setup-node@v4
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''

      - name: Eval — regression vs baseline
        if: env.GEMINI_API_KEY != '' && env.GROQ_API_KEY != ''
        run: pnpm eval --compare
